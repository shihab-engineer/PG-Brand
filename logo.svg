<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#664614" />
    </linearGradient>
    <linearGradient id="blueDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#060C17" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#blueDepth)" stroke="url(#goldShine)" stroke-width="7"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldShine)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <g transform="translate(250, 250) rotate(-35) translate(-250, -250)">
    <ellipse cx="250" cy="120" rx="36" ry="52" fill="url(#goldShine)" filter="url(#shadowGlow)"/>
    <ellipse cx="244" cy="115" rx="20" ry="34" fill="#FFE082" opacity="0.6"/>
    <path d="M250 172 C250 230 246 320 250 400" stroke="url(#goldShine)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="250" cy="405" r="8" fill="url(#goldShine)"/>
  </g>
  <text x="135" y="295" font-family="'Cinzel', serif" font-size="135" font-weight="900" fill="url(#goldShine)" filter="url(#shadowGlow)">P</text>
  <text x="265" y="305" font-family="'Cinzel', serif" font-size="135" font-weight="900" fill="url(#goldShine)" filter="url(#shadowGlow)">G</text>
  <text x="250" y="365" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" letter-spacing="9" fill="#EADCA6" text-anchor="middle">LUXURY CUTLERY</text>
  <line x1="160" y1="385" x2="340" y2="385" stroke="url(#goldShine)" stroke-width="2"/>
</svg>
